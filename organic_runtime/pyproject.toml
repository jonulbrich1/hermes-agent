[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "organic-ai-runtime"
version = "0.5.0"
description = "Organic AI runtime overlay integrated into the Hermes fork scaffold"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12",
    "pydantic-ai-slim[openai]>=2.31,<3",
    "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
organic-ai = "organic_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/organic_runtime", "src/organic_mvp", "src/organic_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
